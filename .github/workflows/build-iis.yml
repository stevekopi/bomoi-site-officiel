name: Construire la version IIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site pour IIS
        run: npm run package:iis
      - name: Créer l’archive IIS
        uses: actions/upload-artifact@v4
        with:
          name: bomoi-site-iis
          path: out/
          if-no-files-found: error
